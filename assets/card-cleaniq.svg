  <text x="32" y="92" fill="#F4F7FB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">CleanIQ</text>
  <text x="32" y="132" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16">A local LLM reads each file and tells you what it is</text><text x="32" y="158" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16">before you delete it. Nothing leaves your machine.</text><text x="32" y="184" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16">Recovered 74.5 GB on my own laptop.</text>
