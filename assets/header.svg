<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Omar Albarghouthi — AI Engineer. LLM apps, RAG and evaluation. Amman, Jordan.">
  <title>Omar Albarghouthi — AI Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0B1324"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
    <clipPath id="r"><rect width="1200" height="420" rx="22"/></clipPath>
  </defs>
  <style>
    .orb { animation: drift 14s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(-60px,30px) scale(1.15); } }
    .ln { opacity: 0; animation: in .5s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    .caret { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2.2s ease-out infinite; transform-origin: 92px 352px; }
    @keyframes pulse { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(2.8); } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(420px); } }
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <g stroke="#1B2740" stroke-width="1" opacity="0.55" mask="url(#gridmask)"><line x1="0" y1="0" x2="0" y2="420"/><line x1="40" y1="0" x2="40" y2="420"/><line x1="80" y1="0" x2="80" y2="420"/><line x1="120" y1="0" x2="120" y2="420"/><line x1="160" y1="0" x2="160" y2="420"/><line x1="200" y1="0" x2="200" y2="420"/><line x1="240" y1="0" x2="240" y2="420"/><line x1="280" y1="0" x2="280" y2="420"/><line x1="320" y1="0" x2="320" y2="420"/><line x1="360" y1="0" x2="360" y2="420"/><line x1="400" y1="0" x2="400" y2="420"/><line x1="440" y1="0" x2="440" y2="420"/><line x1="480" y1="0" x2="480" y2="420"/><line x1="520" y1="0" x2="520" y2="420"/><line x1="560" y1="0" x2="560" y2="420"/><line x1="600" y1="0" x2="600" y2="420"/><line x1="640" y1="0" x2="640" y2="420"/><line x1="680" y1="0" x2="680" y2="420"/><line x1="720" y1="0" x2="720" y2="420"/><line x1="760" y1="0" x2="760" y2="420"/><line x1="800" y1="0" x2="800" y2="420"/><line x1="840" y1="0" x2="840" y2="420"/><line x1="880" y1="0" x2="880" y2="420"/><line x1="920" y1="0" x2="920" y2="420"/><line x1="960" y1="0" x2="960" y2="420"/><line x1="1000" y1="0" x2="1000" y2="420"/><line x1="1040" y1="0" x2="1040" y2="420"/><line x1="1080" y1="0" x2="1080" y2="420"/><line x1="1120" y1="0" x2="1120" y2="420"/><line x1="1160" y1="0" x2="1160" y2="420"/><line x1="1200" y1="0" x2="1200" y2="420"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/></g>
    <circle class="orb" cx="1020" cy="80" r="320" fill="url(#orb)"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#3B82F6" opacity="0.12"/>

    <!-- left: identity -->
    <text x="80" y="96" fill="#7AB0FF" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" letter-spacing="3">AI ENGINEER  ·  AMMAN, JORDAN</text>
    <text x="78" y="168" fill="#F4F7FB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5">Omar Albarghouthi</text>
    <text x="80" y="216" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="24">I build LLM apps and <tspan fill="#F4F7FB" font-weight="700">measure</tspan> whether they work.</text>
    <text x="80" y="252" fill="#5D6E8A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="18">LLM applications · RAG · evaluation · guardrails · Python / FastAPI / React</text>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
      <rect x="80" y="288" width="118" height="34" rx="17" fill="none" stroke="#1B2740"/>
      <text x="139" y="310" fill="#F4F7FB" text-anchor="middle">العربية</text>
      <rect x="208" y="288" width="96" height="34" rx="17" fill="none" stroke="#1B2740"/>
      <text x="256" y="310" fill="#F4F7FB" text-anchor="middle">English</text>
      <rect x="314" y="288" width="196" height="34" rx="17" fill="none" stroke="#1B2740"/>
      <text x="412" y="310" fill="#F4F7FB" text-anchor="middle">Gulf · Jordan · Remote</text>
    </g>

    <circle class="pulse" cx="92" cy="352" r="6" fill="#34D399"/>
    <circle cx="92" cy="352" r="6" fill="#34D399"/>
    <text x="108" y="358" fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="600">Open to AI &amp; software engineering roles</text>

    <!-- right: terminal -->
    <rect x="740" y="92" width="400" height="236" rx="14" fill="#0A1222" stroke="#1B2740"/>
    <circle cx="762" cy="112" r="5" fill="#2A3A58"/><circle cx="780" cy="112" r="5" fill="#2A3A58"/><circle cx="798" cy="112" r="5" fill="#2A3A58"/>
    <g class="ln" style="animation-delay:0.60s"><text x="770" y="150" fill="#93A3BC" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">$</text><text x="796" y="150" fill="#F4F7FB" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">eval --models gpt claude gemini</text></g><g class="ln" style="animation-delay:1.15s"><text x="770" y="184" fill="#34D399" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">✓</text><text x="796" y="184" fill="#93A3BC" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">structured output      validated</text></g><g class="ln" style="animation-delay:1.70s"><text x="770" y="218" fill="#34D399" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">✓</text><text x="796" y="218" fill="#93A3BC" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">cost per turn          logged</text></g><g class="ln" style="animation-delay:2.25s"><text x="770" y="252" fill="#34D399" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">✓</text><text x="796" y="252" fill="#93A3BC" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">refusals &amp; latency     compared</text></g><g class="ln" style="animation-delay:2.80s"><text x="770" y="286" fill="#7AB0FF" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">→</text><text x="796" y="286" fill="#93A3BC" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">route on the numbers. ship.</text></g>
    <rect class="caret" x="796" y="296" width="10" height="20" fill="#7AB0FF"/>
  </g>
</svg>
