<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="How I work: tests before prompts; measure, then route; ship to real users">
  <title>How I work</title>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="18" fill="#070B14" stroke="#1B2740"/>
  <text x="36" y="64" fill="#3B82F6" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="2">01</text><text x="36" y="100" fill="#F4F7FB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="26" font-weight="700">Tests before prompts</text><text x="36" y="140" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20">Write the cases first. A prompt</text><text x="36" y="168" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20">that worked once is not a prompt</text><text x="36" y="196" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20">that works.</text><text x="436" y="64" fill="#3B82F6" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="2">02</text><text x="436" y="100" fill="#F4F7FB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="26" font-weight="700">Measure, then route</text><text x="436" y="140" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20">Cost per turn, latency,</text><text x="436" y="168" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20">refusals, valid-output rate.</text><text x="436" y="196" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20">Pick models on numbers, not</text><text x="436" y="224" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20">hype.</text><line x1="400" y1="40" x2="400" y2="220" stroke="#1B2740"/><text x="836" y="64" fill="#3B82F6" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="2">03</text><text x="836" y="100" fill="#F4F7FB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="26" font-weight="700">Ship to real users</text><text x="836" y="140" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20">Every project here is live or</text><text x="836" y="168" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20">open source. Feedback beats a</text><text x="836" y="196" fill="#93A3BC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20">perfect plan.</text><line x1="800" y1="40" x2="800" y2="220" stroke="#1B2740"/>
</svg>
